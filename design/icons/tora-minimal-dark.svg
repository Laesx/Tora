<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Minimalist, dark: orange striped play on a charcoal tile -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262d"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <mask id="stripes" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <path d="M150 192C204 190 240 198 268 216C236 216 200 222 150 236Z"/>
        <path d="M150 244C218 240 270 246 310 258C268 266 218 270 150 284Z"/>
        <path d="M150 300C198 296 230 300 256 310C228 318 196 326 150 340Z"/>
      </g>
    </mask>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="3"/>
  <g mask="url(#stripes)">
    <polygon points="190,150 190,362 374,256" fill="url(#fur)" stroke="url(#fur)" stroke-width="40" stroke-linejoin="round"/>
  </g>
</svg>
