<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mark (transparent), claw: orange play raked by three tapered claw slashes -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <mask id="claws" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <path d="M244 150Q234 241 182 310Q196 219 244 150Z"/>
        <path d="M290 166Q280 257 228 326Q242 235 290 166Z"/>
        <path d="M334 192Q326 264 282 322Q294 250 334 192Z"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(138 256) scale(1.547) translate(-190 -256)">
    <g mask="url(#claws)">
      <polygon points="190,150 190,362 374,256" fill="url(#fur)" stroke="url(#fur)" stroke-width="40" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
