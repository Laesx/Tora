# Builds the Windows installers (NSIS setup.exe + MSI), signed for the in-app updater.
# Needs the TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) repository secrets; the public key is in tauri.conf.json.
# - Pushing a `v*` tag (e.g. v0.2.0) creates a draft GitHub release with both installers attached.
# - Running it manually (Actions → Release → Run workflow) only builds and keeps the installers as workflow artifacts.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
            exit 1
          }

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Signs the installers for the in-app updater and uploads `latest.json` + `.sig` files to the release.
      # The updater reads releases/latest, so an update ships when the draft is published.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tora v__VERSION__
          releaseDraft: true
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
