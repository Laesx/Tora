[package]
name = "tora"
version = "0.3.0"
description = "Tora - Fast, modern anime library manager & tracker (Taiga clone)"
authors = ["Tora Contributors"]
edition = "2021"

[lib]
name = "tora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
rayon = "1.10"
regex = "1.11"
once_cell = "1.20"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.37"
urlencoding = "2.1"
discord-rich-presence = "1.1"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's WebView2 runtime uses (browser accelerator keys are switched off in setup)
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_Shell"
] }
